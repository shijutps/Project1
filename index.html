<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A stylish Hello World page." />
    <title>Hello, This is Shiju</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f8fafc;
        --muted: #cbd5e1;
        --panel: rgba(15, 23, 42, 0.58);
        --border: rgba(255, 255, 255, 0.16);
        --violet: #a78bfa;
        --cyan: #67e8f9;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: #0f172a;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        width: 42rem;
        height: 42rem;
        border-radius: 50%;
        filter: blur(56px);
        opacity: 0.5;
        pointer-events: none;
        animation: drift 13s ease-in-out infinite alternate;
      }

      body::before { background: #6d28d9; top: -18rem; left: -13rem; }
      body::after { background: #0891b2; right: -15rem; bottom: -18rem; animation-delay: -5s; }

      main {
        width: min(92vw, 720px);
        padding: clamp(2rem, 7vw, 5rem);
        text-align: center;
        border: 1px solid var(--border);
        border-radius: 28px;
        background: var(--panel);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(18px);
        animation: enter 700ms cubic-bezier(.2, .8, .2, 1) both;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        margin: 0 0 1.25rem;
        color: var(--cyan);
        font-size: 0.82rem;
        font-weight: 750;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }

      .spark { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 18px var(--cyan); }

      h1 {
        margin: 0;
        font-size: clamp(3.5rem, 11vw, 7.2rem);
        line-height: 0.96;
        letter-spacing: -0.075em;
        background: linear-gradient(120deg, #fff, var(--cyan), var(--violet));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p { max-width: 38rem; margin: 1.75rem auto 2.2rem; color: var(--muted); font-size: clamp(1rem, 2.5vw, 1.2rem); line-height: 1.7; }

      button {
        border: 0;
        border-radius: 999px;
        padding: 0.9rem 1.35rem;
        color: #0f172a;
        background: linear-gradient(110deg, var(--cyan), #c4b5fd);
        box-shadow: 0 10px 30px rgba(103, 232, 249, 0.22);
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        transition: transform 180ms ease, box-shadow 180ms ease;
      }

      button:hover { transform: translateY(-3px); box-shadow: 0 15px 38px rgba(103, 232, 249, 0.35); }
      button:focus-visible { outline: 3px solid white; outline-offset: 4px; }

      @keyframes enter { from { opacity: 0; transform: translateY(20px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
      @keyframes drift { to { transform: translate(8rem, 5rem) scale(1.18); } }

      @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; } }
      .site-header { position: fixed; top: 1.25rem; left: 50%; z-index: 1; width: min(92vw, 720px); display: flex; align-items: center; justify-content: space-between; transform: translateX(-50%); }
      .brand { color: var(--ink); font-size: 1.25rem; font-weight: 800; letter-spacing: -0.06em; text-decoration: none; }
      .brand span { color: var(--cyan); }
      nav { display: flex; gap: 0.2rem; }
      nav a { padding: 0.45rem 0.7rem; border-radius: 99px; color: var(--muted); font-size: 0.9rem; font-weight: 700; text-decoration: none; }
      nav a:hover, nav .active { color: var(--ink); background: rgba(255,255,255,0.12); }
      .text-link { display: inline-block; margin: 1.3rem 0 0; color: var(--cyan); font-weight: 800; text-decoration: none; }
      .text-link:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">Shiju<span>.</span></a>
      <nav aria-label="Main navigation">
        <a class="active" href="index.html" aria-current="page">Home</a>
        <a href="about.html">About</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>
    <main>
      <div class="eyebrow"><span class="spark"></span> Your new beginning</div>
      <h1>Hello, World!</h1>
      <p>A small greeting with a little bit of magic. This is where great ideas start taking shape.</p>
      <button type="button" id="greet-button">Say hello back</button>
      <a class="text-link" href="about.html">Get to know me &rarr;</a>
    </main>

    <script>
      const button = document.querySelector("#greet-button");
      button.addEventListener("click", () => {
        button.textContent = "Hello to you too! ✨";
      });
    </script>
  </body>
</html>
