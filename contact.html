<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="description" content="Contact Shiju." /><title>Contact | Shiju</title><link rel="stylesheet" href="styles.css" /></head>
<body><header class="site-header"><a class="brand" href="index.html">Shiju<span>.</span></a><nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="gallery.html">Gallery</a><a class="active" href="contact.html" aria-current="page">Contact</a></nav></header>
<main><div class="eyebrow"><span class="spark"></span>Get in touch</div><h1>Let’s talk.</h1><p>Whether you have a project in mind, a question, or just want to share a good idea, send a note below.</p><form id="contact-form"><label for="name">Your name<input id="name" name="name" autocomplete="name" required /></label><label for="email">Email address<input id="email" name="email" type="email" autocomplete="email" required /></label><label for="message">Message<textarea id="message" name="message" required></textarea></label><button type="submit">Send message</button></form></main><script>document.querySelector("#contact-form").addEventListener("submit", event => { event.preventDefault(); event.currentTarget.querySelector("button").textContent = "Thanks — message received!"; event.currentTarget.reset(); });</script></body></html>
